<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Management Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            background: #d4edda;
            color: #155724;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .button {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s ease;
            margin-top: 15px;
            margin-right: 10px;
        }

        .button:hover {
            background: #764ba2;
        }

        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #667eea;
            font-size: 16px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .metric {
            margin-bottom: 15px;
        }

        .metric-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .metric-unit {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            overflow-x: auto;
        }

        .table-container h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #f8f9fa;
            color: #333;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #721c24;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #155724;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding-top: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #666;
            font-size: 13px;
        }

        .info-value {
            color: #333;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👥 HR Management Dashboard</h1>
            <p class="subtitle">ภาพรวมกำลังพลและสวัสดิการ · เชื่อมต่อกับ Google Sheets</p>
            <span class="status" id="status">🔄 กำลังโหลดข้อมูล...</span>
            <button class="button" id="refreshBtn" onclick="refreshData()">🔄 ซิงค์ข้อมูลใหม่</button>
        </header>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>กำลังดึงข้อมูลจาก Google Sheets...</p>
            </div>
        </div>

        <div class="footer">
            <p>🔒 ข้อมูลนี้เป็นความลับของบริษัท ไม่มีข้อมูลรายบุคคล (PDPA)</p>
            <p style="margin-top: 10px; font-size: 12px;">HR Dashboard v2.0 • Hosted on GitHub Pages</p>
        </div>
    </div>

    <script>
        // Google Sheets IDs
        const SHEETS = {
            headcount: '187MfSIoLhebG24ZJUOAIW_54iEC-VpHtv4MhT-wMjIQ',
            master_emp: '17Lkdf2TqYKE4YICDJBB_VIXZr_N5o35TqFe8adiU--s',
            flex: '1ih9JTGkSyLsZvp43Ry8DGHYNHPQIna2Yzp_6hLO2lFQ',
            ot: '1SJK0KhDllw_jwcsR_NBbsn8hIBUhBq-CjGGqbRNbtoI',
            insurance: '10Dd-NaaDMdjcGCPKaZn9DlRbW8YiS0eJVOXQ7cLNjzQ',
            flex2: '1tf1NMtjCoWhG2m7DpG6yYDjgzVQOIkcfOSe8s7niaFE',
            absenteeism: '1GVEwpdSvc6xgZ79kSNgQ9Y2w70tk4TFeqi4ijrGw8Xs'
        };

        // ฟังก์ชันดึงข้อมูลจาก Google Sheets
        async function fetchSheetData(sheetId, sheetName = 'Sheet1') {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;
                const response = await fetch(url);
                const text = await response.text();
                
                // ลบ Google Visualization prefix
                const jsonData = text.substring(47);
                const jsonDataEnd = jsonData.substring(0, jsonData.length - 2);
                const data = JSON.parse(jsonDataEnd);
                
                return data;
            } catch (error) {
                console.error(`Error fetching sheet ${sheetId}:`, error);
                return null;
            }
        }

        // ฟังก์ชันแปลงข้อมูลจาก Google Visualization format
        function parseGoogleData(data) {
            if (!data || !data.table) return [];
            
            const rows = [];
            const headers = [];
            
            // Get headers
            if (data.table.cols) {
                headers.push(...data.table.cols.map(col => col.label));
            }
            
            // Get rows
            if (data.table.rows) {
                data.table.rows.forEach(row => {
                    const rowData = {};
                    row.c.forEach((cell, idx) => {
                        rowData[headers[idx]] = cell ? cell.v : null;
                    });
                    rows.push(rowData);
                });
            }
            
            return rows;
        }

        // ฟังก์ชันสร้าง UI
        async function refreshData() {
            const contentDiv = document.getElementById('content');
            const statusDiv = document.getElementById('status');
            const refreshBtn = document.getElementById('refreshBtn');
            
            statusDiv.textContent = '🔄 กำลังโหลด...';
            statusDiv.className = 'status loading';
            refreshBtn.disabled = true;
            
            contentDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>กำลังดึงข้อมูลจาก Google Sheets...</p>
                </div>
            `;

            try {
                // ดึงข้อมูลจากทั้ง 7 sheets
                const [headcountData, empData, flexData, otData, insuranceData, flex2Data, absenteeismData] = await Promise.all([
                    fetchSheetData(SHEETS.headcount),
                    fetchSheetData(SHEETS.master_emp),
                    fetchSheetData(SHEETS.flex),
                    fetchSheetData(SHEETS.ot),
                    fetchSheetData(SHEETS.insurance),
                    fetchSheetData(SHEETS.flex2),
                    fetchSheetData(SHEETS.absenteeism)
                ]);

                // แปลงข้อมูล
                const headcount = parseGoogleData(headcountData);
                const employees = parseGoogleData(empData);
                const flex = parseGoogleData(flexData);
                const ot = parseGoogleData(otData);
                const insurance = parseGoogleData(insuranceData);
                const flex2 = parseGoogleData(flex2Data);
                const absenteeism = parseGoogleData(absenteeismData);

                // สร้าง HTML
                let html = '';

                // KPI Cards
                html += '<div class="grid">';
                html += createMetricCard('👥 จำนวนพนักงาน', headcount.length, 'คน');
                html += createMetricCard('📊 ข้อมูลพนักงาน', employees.length, 'รายการ');
                html += createMetricCard('🎁 Flex Benefit', flex.length, 'รายการ');
                html += createMetricCard('⏱️ ค่า OT', ot.length, 'รายการ');
                html += '</div>';

                // Tables
                if (headcount.length > 0) {
                    html += createTable('📅 ข้อมูลอัตรากำลัง (Headcount)', headcount);
                }
                if (employees.length > 0) {
                    html += createTable('👤 ข้อมูลพนักงาน (Master Emp)', employees);
                }
                if (flex.length > 0) {
                    html += createTable('🎁 Flex Benefit', flex);
                }
                if (ot.length > 0) {
                    html += createTable('⏱️ ค่า OT', ot);
                }
                if (insurance.length > 0) {
                    html += createTable('🏥 ประกันสุขภาพ (Insurance)', insurance);
                }

                contentDiv.innerHTML = html;
                statusDiv.textContent = '✅ เชื่อมต่อสำเร็จ';
                statusDiv.className = 'status';

            } catch (error) {
                console.error('Error:', error);
                contentDiv.innerHTML = `
                    <div class="error-message">
                        ❌ ไม่สามารถดึงข้อมูลได้ - ${error.message}
                    </div>
                `;
                statusDiv.textContent = '❌ เกิดข้อผิดพลาด';
                statusDiv.className = 'status error';
            }

            refreshBtn.disabled = false;
        }

        // สร้าง Metric Card
        function createMetricCard(label, value, unit) {
            return `
                <div class="card">
                    <div class="metric">
                        <div class="metric-label">${label}</div>
                        <div class="metric-value">${value.toLocaleString('en-US')}</div>
                        <div class="metric-unit">${unit}</div>
                    </div>
                </div>
            `;
        }

        // สร้าง Table
        function createTable(title, data) {
            if (!data || data.length === 0) return '';
            
            const headers = Object.keys(data[0]);
            let html = `
                <div class="table-container">
                    <h2>${title}</h2>
                    <table>
                        <thead>
                            <tr>
                                ${headers.map(h => `<th>${h}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            // แสดง 10 แถวแรก
            data.slice(0, 10).forEach(row => {
                html += '<tr>';
                headers.forEach(header => {
                    const value = row[header];
                    html += `<td>${value !== null && value !== undefined ? value : '—'}</td>`;
                });
                html += '</tr>';
            });
            
            html += `
                        </tbody>
                    </table>
                    ${data.length > 10 ? `<p style="text-align: center; margin-top: 15px; color: #666; font-size: 12px;">แสดง 10 รายการแรก (รวม ${data.length} รายการ)</p>` : ''}
                </div>
            `;
            
            return html;
        }

        // Load data on page load
        window.addEventListener('load', refreshData);
    </script>
</body>
</html>
